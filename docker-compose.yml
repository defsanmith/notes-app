version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: notes-app-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - notes_app_data:/var/lib/postgresql/data
    networks:
      - notes-app-network

volumes:
  notes_app_data:

networks:
  notes-app-network:
    driver: bridge
